<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">

  <head>
    {{ partial "docs/html-head" . }}
    {{ partial "docs/inject/head" . }}

    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        color: var(--body-font-color);
      }
      .terminal-404 {
        font-family: 'Roboto Mono', monospace;
        font-size: 1.1rem;
        line-height: 1.8;
        padding: 2rem;
      }
      .terminal-404 .prompt {
        color: var(--color-link);
      }
      .terminal-404 a {
        color: var(--color-link);
      }
      .terminal-404 .cursor {
        display: inline-block;
        width: 0.55em;
        height: 1em;
        vertical-align: text-bottom;
        background: var(--color-link);
        animation: term-blink 1s steps(1) infinite;
      }
      @keyframes term-blink {
        50% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .terminal-404 .cursor { animation: none; }
      }
    </style>
  </head>

  <body>
    <main class="terminal-404">
      <p><span class="prompt">$</span> cd <span class="notfound-path">this page</span></p>
      <p>cd: The directory '<span class="notfound-path">this page</span>' does not exist</p>
      <p><span class="prompt">$</span> open <a href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a></p>
      <p><span class="prompt">$</span> <span class="cursor"></span></p>
    </main>

    <script>
      var notFoundPathEls = document.querySelectorAll('.notfound-path');
      if (notFoundPathEls.length && window.location && window.location.pathname) {
        notFoundPathEls.forEach(function (el) {
          el.textContent = window.location.pathname;
        });
      }
    </script>

    {{ partial "docs/inject/body" . }}
  </body>

  </html>
